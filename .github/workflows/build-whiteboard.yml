name: Build Whiteboard (Windows)

on:
  push:
    branches: [whiteboard-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "false"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "67108864"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: whiteboard
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/whiteboard_app/web/package-lock.json

      - name: Bundle Excalidraw (web/dist, embedded into the exe)
        working-directory: crates/whiteboard_app/web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build
        run: cargo build --release -p whiteboard_app

      - uses: actions/upload-artifact@v4
        with:
          name: Whiteboard-windows
          path: target/release/whiteboard.exe
          retention-days: 7
