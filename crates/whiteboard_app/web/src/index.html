<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Whiteboard</title>
    <link rel="stylesheet" href="/main.css" />
    <style>
      :root[data-theme="dark"] {
        --wb-bg: #121212;
        --wb-dot: rgba(255, 255, 255, 0.13);
      }
      :root[data-theme="light"] {
        --wb-bg: #ffffff;
        --wb-dot: rgba(0, 0, 0, 0.16);
      }
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background-color: var(--wb-bg);
      }
      #root {
        background-image: radial-gradient(var(--wb-dot) 1px, transparent 1.3px);
        background-size: 20px 20px;
      }
      /* Bigger main toolbar. */
      .excalidraw .App-toolbar-container .ToolIcon__icon {
        width: 3.25rem;
        height: 3.25rem;
        border-radius: 10px;
      }
      .excalidraw .App-toolbar-container .ToolIcon__icon svg {
        width: 1.35rem;
        height: 1.35rem;
      }
      .excalidraw .App-toolbar-container .ToolIcon__keybinding {
        font-size: 0.7rem;
        bottom: 4px;
        right: 6px;
      }
      .excalidraw .App-toolbar-container .Island {
        padding: 6px;
        border-radius: 14px;
      }
      .excalidraw,
      .excalidraw .excalidraw-container {
        background: transparent !important;
      }
      .sticky-paper {
        position: relative;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: 30px 16px 16px;
        border-radius: 2px 2px 2px 18px;
        color: #2b2b2b;
        font: 20px/1.3 Excalifont, "Segoe Print", cursive;
        box-shadow: 0 10px 18px -6px rgba(0, 0, 0, 0.55), 0 2px 4px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
      .sticky-paper::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 22px;
        background: rgba(0, 0, 0, 0.06);
      }
      .sticky-paper::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 18px;
        height: 18px;
        background: linear-gradient(45deg, var(--wb-bg) 50%, rgba(0, 0, 0, 0.18) 50%);
      }
      .sticky-text {
        height: 100%;
        outline: none;
        white-space: pre-wrap;
        word-break: break-word;
        cursor: text;
      }
      .sticky-text:empty::before {
        content: attr(data-placeholder);
        color: rgba(0, 0, 0, 0.35);
      }
      .sticky-colors {
        position: absolute;
        top: 4px;
        right: 6px;
        display: flex;
        gap: 4px;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .sticky-paper:hover .sticky-colors {
        opacity: 1;
      }
      .sticky-colors button {
        width: 14px;
        height: 14px;
        padding: 0;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.25);
        cursor: pointer;
      }
    </style>
    <script>
      // Fonts are served offline by the Rust shell under /fonts/.
      window.EXCALIDRAW_ASSET_PATH = location.origin + "/";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
