<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Whiteboard</title>
    <link rel="stylesheet" href="/main.css" />
    <style>
      :root[data-theme="dark"] {
        --wb-bg: #121212;
        --wb-dot: rgba(255, 255, 255, 0.13);
      }
      :root[data-theme="light"] {
        --wb-bg: #ffffff;
        --wb-dot: rgba(0, 0, 0, 0.16);
      }
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background-color: var(--wb-bg);
      }
      #root {
        background-image: radial-gradient(var(--wb-dot) 1px, transparent 1.3px);
        background-size: 20px 20px;
      }
      /* Bigger main toolbar (desktop layout only; the narrow/mobile toolbar keeps its size). */
      @media (min-width: 900px) {
      .excalidraw .App-toolbar-container .ToolIcon__icon {
        width: 3.25rem;
        height: 3.25rem;
        border-radius: 10px;
      }
      .excalidraw .App-toolbar-container .ToolIcon__icon svg {
        width: 1.35rem;
        height: 1.35rem;
      }
      .excalidraw .App-toolbar-container .ToolIcon__keybinding {
        font-size: 0.7rem;
        bottom: 4px;
        right: 6px;
      }
      .excalidraw .App-toolbar-container .Island {
        padding: 6px;
        border-radius: 14px;
      }
      /* "More tools" trigger: same size as the tools and vertically centred. */
      .excalidraw .App-toolbar__extra-tools-trigger {
        width: 3.25rem;
        height: 3.25rem;
        border-radius: 10px;
        align-self: center;
      }
      .excalidraw .App-toolbar__extra-tools-trigger svg {
        width: 1.35rem;
        height: 1.35rem;
      }
      /* Toolbar pinned to the middle of the window: it never shifts when the
         right sidebar (Library / Search) opens, docks or switches tabs. */
      .excalidraw .App-menu_top {
        grid-template-columns: 1fr auto 1fr;
        width: calc(100vw - 2 * var(--editor-container-padding, 1rem));
        box-sizing: border-box;
      }
      }
      .excalidraw,
      .excalidraw .excalidraw-container {
        background: transparent !important;
      }
      .sticky-palette {
        position: fixed;
        z-index: 10;
        display: flex;
        gap: 6px;
        padding: 6px;
        transform: translateX(-100%);
        border-radius: 999px;
        background: var(--wb-palette-bg, #232329);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      }
      :root[data-theme="light"] {
        --wb-palette-bg: #ffffff;
      }
      .sticky-palette button {
        width: 16px;
        height: 16px;
        padding: 0;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.25);
        cursor: pointer;
      }
    </style>
    <script>
      // Fonts are served offline by the Rust shell under /fonts/.
      window.EXCALIDRAW_ASSET_PATH = location.origin + "/";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
