[package]
name = "whiteboard_app"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

# Standalone whiteboard: real Excalidraw (web/, bundled offline into the exe) in a native
# window via wry/WebView2. Runs only while open, so it costs no RAM when closed.

[[bin]]
name = "whiteboard"
path = "src/main.rs"

[dependencies]
include_dir = "0.7"
rfd = "0.18"
serde_json.workspace = true
tao = "0.37"
wry = "0.57"
