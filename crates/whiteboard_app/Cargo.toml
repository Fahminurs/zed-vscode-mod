[package]
name = "whiteboard_app"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints]
workspace = true

[[bin]]
name = "whiteboard"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
# Path dep: `default-features = false` is ignored on a `workspace = true` dep.
whiteboard = { path = "../whiteboard", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { workspace = true, features = ["windows-manifest"] }
